name: CI

on:
  push:

jobs:
  checks:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Offline diagnostics
        run: npm test

      # Deterministic UI anti-pattern scan. Rendered-page rules (contrast,
      # tiny text) need a running server, so run those locally per page.
      - name: Design audit
        run: npm run design:audit

      # Catches build-time failures tsc alone does not report.
      - name: Build
        run: npm run build
